<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Project | TaskFlow</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f5f7fb;
            color: #1f2937;
        }

        .navbar {
            height: 70px;
            background: #111827;
            color: white;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 40px;
        }

        .logo {
            font-size: 25px;
            font-weight: bold;
        }

        .back {
            color: white;
            text-decoration: none;
            background: #374151;
            padding: 9px 16px;
            border-radius: 8px;
        }

        .container {
            max-width: 700px;
            margin: 50px auto;
            padding: 0 20px;
        }

        .card {
            background: white;
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
        }

        h1 {
            margin-bottom: 8px;
        }

        .subtitle {
            color: #6b7280;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 22px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input,
        textarea,
        select {
            width: 100%;
            padding: 13px;
            border: 1px solid #d1d5db;
            border-radius: 9px;
            font-size: 15px;
            outline: none;
        }

        textarea {
            min-height: 140px;
            resize: vertical;
        }

        input:focus,
        textarea:focus,
        select:focus {
            border-color: #4f46e5;
        }

        .actions {
            display: flex;
            gap: 12px;
            margin-top: 10px;
        }

        .btn {
            border: none;
            padding: 13px 22px;
            border-radius: 9px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            font-size: 15px;
        }

        .create {
            background: #4f46e5;
            color: white;
        }

        .create:hover {
            background: #4338ca;
        }

        .cancel {
            background: #e5e7eb;
            color: #374151;
        }

        @media (max-width: 600px) {
            .navbar {
                padding: 0 18px;
            }

            .container {
                margin-top: 30px;
            }

            .card {
                padding: 25px;
            }

            .actions {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

<nav class="navbar">

    <div class="logo">
        📋 TaskFlow
    </div>

    <a href="{% url 'dashboard' %}" class="back">
        ← Dashboard
    </a>

</nav>


<main class="container">

    <div class="card">

        <h1>Create New Project</h1>

        <p class="subtitle">
            Set up a project and start managing your tasks.
        </p>

        <form method="POST">

            {% csrf_token %}

            <div class="form-group">
                <label>Project Name</label>

                <input
                    type="text"
                    name="name"
                    placeholder="Enter project name"
                    required
                >
            </div>


            <div class="form-group">

                <label>Description</label>

                <textarea
                    name="description"
                    placeholder="Describe your project..."
                ></textarea>

            </div>


            <div class="form-group">

                <label>Project Status</label>

                <select name="status">

                    <option value="planning">
                        Planning
                    </option>

                    <option value="active">
                        Active
                    </option>

                    <option value="completed">
                        Completed
                    </option>

                </select>

            </div>


            <div class="actions">

                <button
                    type="submit"
                    class="btn create"
                >
                    Create Project
                </button>

                <a
                    href="{% url 'dashboard' %}"
                    class="btn cancel"
                >
                    Cancel
                </a>

            </div>

        </form>

    </div>

</main>

</body>
</html>
