<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Task | TaskFlow</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f5f7fb;
            color: #1f2937;
        }

        .navbar {
            height: 70px;
            background: #111827;
            color: white;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 40px;
        }

        .logo {
            font-size: 25px;
            font-weight: bold;
        }

        .back {
            color: white;
            text-decoration: none;
            background: #374151;
            padding: 9px 16px;
            border-radius: 8px;
        }

        .container {
            max-width: 750px;
            margin: 45px auto;
            padding: 0 20px;
        }

        .card {
            background: white;
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.08);
        }

        h1 {
            margin-bottom: 8px;
        }

        .subtitle {
            color: #6b7280;
            margin-bottom: 25px;
        }

        .task-name {
            background: #eef2ff;
            color: #4338ca;
            padding: 10px 14px;
            border-radius: 8px;
            margin-bottom: 25px;
            font-weight: bold;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input,
        textarea,
        select {
            width: 100%;
            padding: 13px;
            border: 1px solid #d1d5db;
            border-radius: 9px;
            font-size: 15px;
            outline: none;
        }

        textarea {
            min-height: 130px;
            resize: vertical;
        }

        input:focus,
        textarea:focus,
        select:focus {
            border-color: #4f46e5;
        }

        .actions {
            display: flex;
            gap: 12px;
            margin-top: 10px;
        }

        .btn {
            border: none;
            padding: 13px 22px;
            border-radius: 9px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            font-size: 15px;
        }

        .save {
            background: #4f46e5;
            color: white;
        }

        .save:hover {
            background: #4338ca;
        }

        .cancel {
            background: #e5e7eb;
            color: #374151;
        }

        @media (max-width: 600px) {
            .navbar {
                padding: 0 18px;
            }

            .card {
                padding: 25px;
            }

            .actions {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

<nav class="navbar">

    <div class="logo">
        📋 TaskFlow
    </div>

    <a
        href="{% url 'project_detail' project.id %}"
        class="back"
    >
        ← Project
    </a>

</nav>


<main class="container">

    <div class="card">

        <h1>Edit Task</h1>

        <p class="subtitle">
            Update task details, status, priority or assignment.
        </p>

        <div class="task-name">
            ✏️ {{ task.title }}
        </div>

        <form method="POST">

            {% csrf_token %}

            <div class="form-group">
                <label>Task Title</label>

                <input
                    type="text"
                    name="title"
                    value="{{ task.title }}"
                    required
                >
            </div>


            <div class="form-group">

                <label>Description</label>

                <textarea
                    name="description"
                >{{ task.description }}</textarea>

            </div>


            <div class="form-group">

                <label>Assign To</label>

                <select name="assigned_to">

                    <option value="">
                        -- Select Team Member --
                    </option>

                    {% for member in members %}

                        <option
                            value="{{ member.id }}"
                            {% if task.assigned_to and task.assigned_to.id == member.id %}
                                selected
                            {% endif %}
                        >
                            {{ member.username }}
                        </option>

                    {% endfor %}

                </select>

            </div>


            <div class="form-group">

                <label>Status</label>

                <select name="status">

                    <option
                        value="todo"
                        {% if task.status == "todo" %}selected{% endif %}
                    >
                        To Do
                    </option>

                    <option
                        value="in_progress"
                        {% if task.status == "in_progress" %}selected{% endif %}
                    >
                        In Progress
                    </option>

                    <option
                        value="completed"
                        {% if task.status == "completed" %}selected{% endif %}
                    >
                        Completed
                    </option>

                </select>

            </div>


            <div class="form-group">

                <label>Priority</label>

                <select name="priority">

                    <option
                        value="low"
                        {% if task.priority == "low" %}selected{% endif %}
                    >
                        Low
                    </option>

                    <option
                        value="medium"
                        {% if task.priority == "medium" %}selected{% endif %}
                    >
                        Medium
                    </option>

                    <option
                        value="high"
                        {% if task.priority == "high" %}selected{% endif %}
                    >
                        High
                    </option>

                </select>

            </div>


            <div class="form-group">

                <label>Due Date</label>

                <input
                    type="date"
                    name="due_date"
                    value="{{ task.due_date|date:'Y-m-d' }}"
                >

            </div>


            <div class="actions">

                <button
                    type="submit"
                    class="btn save"
                >
                    💾 Save Changes
                </button>

                <a
                    href="{% url 'project_detail' project.id %}"
                    class="btn cancel"
                >
                    Cancel
                </a>

            </div>

        </form>

    </div>

</main>

</body>
</html>
